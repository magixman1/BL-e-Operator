name: Build BL-e Operator APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"
  EXPO_NO_GIT_STATUS: "1"

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NPM Dependencies & Align Expo SDK Versions
        run: |
          npm install
          npx expo install --fix

      - name: Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Configure Gradle Properties for Stable Build
        run: |
          sed -i 's/newArchEnabled=true/newArchEnabled=false/g' android/gradle.properties || true
          echo "" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/BL-e-Operator.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BL-e-Operator-APK
          path: android/app/build/outputs/apk/debug/BL-e-Operator.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'v1.0.0' || github.ref_name }}
          name: BL-e Operator Latest APK
          body: |
            ### BL-e Operator - Android APK
            Automated cloud build for **BL-e Operator**.
          files: android/app/build/outputs/apk/debug/BL-e-Operator.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
